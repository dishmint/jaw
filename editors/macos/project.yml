# XcodeGen spec for the JAW Quick Look app + preview extension.
#
#   brew install xcodegen
#   xcodegen generate          # produces JAWQuickLook.xcodeproj
#   open JAWQuickLook.xcodeproj
#
# See README.md for the full build / install / test walkthrough.

name: JAWQuickLook
options:
  bundleIdPrefix: com.dishmint.jaw
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "12.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM here (or in Xcode) to your Apple Developer Team ID so
    # the app and the embedded extension are signed with the same identity.
    DEVELOPMENT_TEAM: ""

targets:
  # The container app. Its only jobs are to (a) export the `jaw` Uniform Type
  # Identifier so Finder recognizes .jaw files, and (b) host the preview
  # extension. macOS will not load an extension that lives outside an app.
  JAWQuickLook:
    type: application
    platform: macOS
    sources:
      - path: JAWQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dishmint.jaw.quicklook
        INFOPLIST_FILE: JAWQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: JAWQuickLook/JAWQuickLook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: JAWQuickLookExtension
        embed: true

  # The Quick Look preview extension. Renders a .jaw file as syntax-highlighted
  # HTML inside a WKWebView when you press space in Finder.
  JAWQuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: JAWQuickLookExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dishmint.jaw.quicklook.JAWQuickLookExtension
        INFOPLIST_FILE: JAWQuickLookExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: JAWQuickLookExtension/JAWQuickLookExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
