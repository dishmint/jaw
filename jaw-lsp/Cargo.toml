[package]
name = "jaw-lsp"
version = "0.3.1"
edition = "2021"

[dependencies]
jaw-parse = { path = "../jaw-parse" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unix-only: a tiny, ubiquitous binding used solely for the parent-process
# liveness probe (`kill(pid, 0)`) in watchdog.rs, so an orphaned server exits
# instead of leaking.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
